<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>qqbot-onebot 管理台</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录视图 -->
<div id="login-view" class="login-wrap hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <h1 class="login-title"><img class="brand-icon" src="favicon.png" alt="">qqbot-onebot</h1>
    <p class="muted">QQ 官方机器人 → OneBot v11 适配器 · 管理台</p>
    <label>用户名
      <input name="username" required autocomplete="username" autofocus>
    </label>
    <label>密码
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn primary block">登 录</button>
    <div id="login-error" class="form-error hidden"></div>
  </form>
</div>

<!-- 应用视图 -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="brand"><img class="brand-icon" src="favicon.png" alt=""><span>qqbot<span class="brand-dim">-onebot</span></span></div>
    <nav id="nav" class="nav">
      <a href="#/bots" data-route="bots">Bot 管理</a>
      <a href="#/access" data-route="access">黑白名单</a>
      <a href="#/chat" data-route="chat" data-min-role="advanced">聊天</a>
      <a href="#/records" data-route="records">记录</a>
      <a href="#/stats" data-route="stats">统计</a>
      <a href="#/settings" data-route="settings">设置</a>
      <a href="#/help" data-route="help">帮助</a>
    </nav>
    <div class="topbar-right">
      <button id="update-btn" class="btn small primary hidden" type="button">更新</button>
      <button id="theme-btn" class="icon-btn" title="切换亮/暗色">🌗</button>
      <a id="repo-link" class="icon-btn repo-link" href="https://github.com/Loping151/qbob" target="_blank" rel="noopener" title="GitHub 仓库" aria-label="GitHub 仓库"><svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
      <span id="whoami"></span>
      <button id="logout-btn" class="btn small ghost">登出</button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <footer id="footer" class="footer"></footer>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script type="module" src="app.js"></script>
</body>
</html>
